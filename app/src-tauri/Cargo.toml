[package]
name = "numpad-deck"
version = "0.1.0"
description = "NumLock이 꺼졌을 때 넘패드를 매크로 패드로 쓰게 해 주는 Windows 상주 앱"
edition.workspace = true
license.workspace = true

[lib]
# 바이너리 이름과 겹치지 않게 `_lib`를 붙인다 (Windows에서 필요).
name = "numpad_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
numpad-deck-core = { path = "../../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
