[package]
name = "numpad-deck-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Numpad Deck 코어: 저수준 키보드 훅, 덱 모드 판정, 입력 주입"

[lib]
name = "deck_core"

[[bin]]
name = "deck-probe"
path = "src/bin/deck-probe.rs"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_EnhancedStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies]
notify-debouncer-mini = "0.7.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "vorbis", "wav", "flac"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[dev-dependencies]
tempfile = "3.27.0"
